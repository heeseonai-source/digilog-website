<!doctype html>
<html lang="ko" class="no-js">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>강의 문의 | 디지로그쌤 노희선</title>
<meta name="description" content="기관·단체 생성형 AI 강의, 연수, 멘토링, 콘텐츠 협업 문의.">
<meta name="theme-color" content="#FFFBF5">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23F2603F'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-family='Arial' font-weight='700' font-size='24' fill='%23fff'%3Ed%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css"><script src="/script.js" defer></script>
</head>
<body data-page="contact">
<a class="skip-link" href="#main">본문 바로가기</a>
<header class="site-header" data-include="header"></header>
<main id="main">

<section class="page-hero">
  <div class="wrap">
    <span class="eyebrow">강의 문의</span>
    <h1>강의를 함께 만들어요</h1>
    <p>기관·대상·인원·희망 일정·교육 목표를 알려 주시면 맞춤 커리큘럼을 제안드립니다.</p>
  </div>
</section>

<section class="section">
  <div class="wrap contact-grid">
    <div class="contact-side">
      <div class="card">
        <h2>📧 이메일</h2>
        <p><a class="text-link" href="mailto:heeseon.ai@gmail.com?subject=%EA%B0%95%EC%9D%98%20%EB%AC%B8%EC%9D%98">heeseon.ai@gmail.com</a></p>
      </div>
      <div class="card">
        <h2>📝 블로그</h2>
        <p>출강 현장과 수업 내용을 미리 볼 수 있어요.<br><a class="text-link" href="https://blog.naver.com/heeseon_ai" target="_blank" rel="noopener">디지로그쌤의 AI 기록</a></p>
      </div>
      <div class="card">
        <h2>🗂️ 이런 문의를 받아요</h2>
        <p>기관·단체 출강 · 공무원/교직원 연수 · 소상공인 교육 · 시니어 디지털 교육 · 대학 멘토링 · 콘텐츠 협업</p>
      </div>
    </div>

    <form class="card" id="contact-form">
      <div class="form-row">
        <div class="field"><label for="f-org">기관·단체명 <span class="req">*</span></label><input id="f-org" name="org" required autocomplete="organization"></div>
        <div class="field"><label for="f-name">담당자 성함 <span class="req">*</span></label><input id="f-name" name="name" required autocomplete="name"></div>
        <div class="field"><label for="f-phone">연락처</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" placeholder="010-0000-0000"></div>
        <div class="field"><label for="f-email">이메일 <span class="req">*</span></label><input id="f-email" name="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="f-aud">교육 대상</label><input id="f-aud" name="audience" placeholder="예: 시니어, 소상공인, 교직원"></div>
        <div class="field"><label for="f-size">예상 인원</label><input id="f-size" name="size" placeholder="예: 20명"></div>
        <div class="field"><label for="f-date">희망 일정</label><input id="f-date" name="date" placeholder="예: 12월 중 평일 오후 2시간"></div>
        <div class="field"><label for="f-topic">관심 주제</label>
          <select id="f-topic" name="topic">
            <option value="">선택해 주세요</option>
            <option>생성형 AI 기초와 실전 활용</option>
            <option>AI 문서 작성·업무 자동화</option>
            <option>AI 이미지·영상 콘텐츠 제작</option>
            <option>SNS·마케팅 콘텐츠 AI 활용</option>
            <option>AI 윤리와 저작권</option>
            <option>바이브코딩 입문</option>
            <option>왕초탈 챗GPT</option>
            <option>아직 모르겠어요 (상담 원해요)</option>
          </select>
        </div>
      </div>
      <div class="field"><label for="f-msg">교육 목표·요청 사항</label><textarea id="f-msg" name="message" placeholder="장소, 대면/온라인, 기대하는 결과 등을 자유롭게 적어 주세요."></textarea></div>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="check"><input type="checkbox" name="agree" value="동의" required> <span>문의 회신을 위해 이름·연락처·이메일을 수집하며, 상담 종료 후 1년 뒤 삭제합니다. 이에 동의합니다. <span class="req">*</span></span></label>
      <button class="btn btn-primary" type="submit" style="width:100%">문의 보내기</button>
      <p class="form-msg" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

</main>
<footer class="site-footer" data-include="footer"></footer>
</body>
</html>
