<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 | 디지로그쌤</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2323262F'/%3E%3Ctext x='20' y='29' text-anchor='middle' font-family='Arial' font-weight='700' font-size='24' fill='%23fff'%3Ed%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css">
<style>
  body{background:#F6F2EC;font-size:16px}
  /* 관리자 화면 전용 버튼·카드 (공개 페이지는 Astryx 컴포넌트 사용) */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:17px;padding:14px 26px;border-radius:999px;border:2px solid transparent;cursor:pointer;font-family:inherit;transition:transform .15s,background .15s,border-color .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn-primary{background:var(--coral);color:#fff}
  .btn-primary:hover{background:var(--coral-dark)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--ink)}
  .btn-light{background:#fff;color:var(--ink)}
  .btn[disabled]{opacity:.6;cursor:wait;transform:none}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
  .login{min-height:100vh;display:grid;place-items:center;padding:16px}
  .login .card{width:min(420px,100%)}
  .login h1{font-size:24px;margin-bottom:6px}
  .login p{color:var(--muted);margin-bottom:20px;font-size:15px}
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  .side{background:var(--ink);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
  .side .logo{color:#fff;margin:0 6px 22px}
  .side .logo small{color:#AEB3C2}
  .side h2{font-size:12px;color:#AEB3C2;margin:18px 10px 6px;font-weight:700;letter-spacing:.04em}
  .side button{display:block;width:100%;text-align:left;border:0;background:none;color:#E8EAF0;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;cursor:pointer}
  .side button:hover{background:rgba(255,255,255,.08)}
  .side button[aria-current="true"]{background:var(--coral);color:#fff;font-weight:700}
  .side .bottom{margin-top:24px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
  .main{padding:0 0 120px;min-width:0}
  .topbar{position:sticky;top:0;z-index:5;background:rgba(246,242,236,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .topbar h1{font-size:20px;flex:1}
  .topbar .status{font-size:14px;color:var(--muted)}
  .topbar .status.dirty{color:var(--coral-dark);font-weight:700}
  .topbar .btn{padding:10px 20px;font-size:15px}
  .content{padding:24px 28px;max-width:880px}
  .notice{background:var(--sun-soft);border-radius:14px;padding:14px 18px;font-size:14px;margin-bottom:20px;color:#5c4200}
  .notice b{color:var(--ink)}
  .f{margin-bottom:16px}
  .f > label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
  .f .help{display:block;color:var(--muted);font-size:13px;margin-top:4px}
  .f input,.f textarea,.f select{font-size:15px;padding:10px 12px;border-width:1.5px}
  .f textarea{min-height:90px}
  .group{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px 4px;margin-bottom:18px}
  .group > .gtitle{font-size:17px;font-weight:800;margin-bottom:14px}
  .list{display:grid;gap:10px;margin-bottom:10px}
  .item{background:#FFFCF7;border:1px solid var(--line);border-radius:14px}
  .item > summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;font-weight:700;font-size:15px}
  .item > summary::-webkit-details-marker{display:none}
  .item > summary .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item > summary .n{color:var(--muted);font-weight:600;font-size:13px}
  .item[open] > summary{border-bottom:1px dashed var(--line)}
  .item .body{padding:14px 14px 2px}
  .mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
  .mini:hover{border-color:var(--ink)}
  .mini.danger:hover{border-color:#B3261E;color:#B3261E}
  .add{border:2px dashed var(--line);background:none;border-radius:12px;padding:10px;width:100%;font:inherit;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:16px}
  .add:hover{border-color:var(--coral);color:var(--coral-dark)}
  .img-field{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
  .img-field .thumb{width:120px;height:90px;border-radius:10px;object-fit:cover;background:var(--coral-soft) center/40px no-repeat}
  .img-field .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .file-row{display:flex;gap:8px}
  .file-row input{flex:1}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:15px;z-index:20;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
  .toast.error{background:#B3261E}
  .page-select{display:none}
  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .side{display:none}
    .page-select{display:block;width:auto;flex:1 1 100%;font-weight:700}
    .topbar{padding:12px 16px}
    .topbar h1{display:none}
    .content{padding:18px 16px}
    .img-field{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="root"><p style="padding:40px;text-align:center;color:var(--muted)">불러오는 중…</p></div>
<script src="/admin.js"></script>
</body>
</html>
